<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F211D;
    --surface: #16302A;
    --surface-2: #1C3B33;
    --line: #2C4C43;
    --ink: #EBF0EC;
    --ink-dim: #A9BDB4;
    --amber: #E0A458;
    --amber-dim: #8C6A3E;
    --water: #6FA8B8;
    --danger: #C97064;
  }
  *{box-sizing:border-box;}
  html{
    background:var(--bg);
    overflow-x:hidden;
    touch-action:pan-y;
  }
  html, body{
    margin:0;
    min-height:100vh;
    width:100%;
    max-width:100%;
    overflow-x:hidden;
  }
  body{
    background:
      radial-gradient(ellipse 600px 400px at 50% -10%, #234A40 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;width:100%;margin:0 auto;padding:20px 16px 80px;overflow-x:hidden;}
  header.top{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:8px 0 22px;margin-bottom:20px;
  }
  .hero-mark{display:block;margin-bottom:10px;}
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin:0;
    letter-spacing:0.3px;
  }
  .sub{color:var(--ink-dim);font-size:12.5px;margin-top:5px;letter-spacing:0.3px;}
  .hero-rule{
    width:56px;height:1px;margin-top:16px;
    background:linear-gradient(90deg, transparent, var(--amber-dim), transparent);
  }
  nav.tabs{display:flex;gap:6px;margin-bottom:22px;}
  nav.tabs button{
    flex:1;padding:10px 0;background:var(--surface);border:1px solid var(--line);
    color:var(--ink-dim);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;cursor:pointer;
    border-radius:4px;letter-spacing:0.2px;transition:border-color .15s;
  }
  nav.tabs button.active{background:var(--surface-2);color:var(--amber);border-color:var(--amber-dim);}
  section{display:none;}
  section.active{display:block;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber-dim);
    border-radius:2px;padding:16px;margin-bottom:14px;
  }
  .card h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 10px;}
  button.primary{
    width:100%;padding:13px;background:var(--amber);color:#1B120A;border:none;
    border-radius:3px;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  button.primary:disabled{opacity:0.5;cursor:default;}
  button.secondary{
    width:100%;padding:11px;background:none;border:1px solid var(--line);color:var(--ink);
    border-radius:3px;font-family:inherit;font-size:13.5px;cursor:pointer;margin-top:8px;
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;}
  .stat .label{font-size:11px;color:var(--ink-dim);}
  .stat .val{font-size:17px;font-family:'Fraunces',serif;margin-top:2px;}
  .stat .trend{font-size:11px;margin-top:2px;color:var(--water);}
  .notice{font-size:12.5px;color:var(--ink-dim);margin-top:10px;line-height:1.5;}
  .insight-list{margin:10px 0 0;padding-left:0;list-style:none;font-size:13px;line-height:1.55;}
  .insight-list li{padding-left:14px;position:relative;margin-bottom:6px;color:var(--ink);}
  .insight-list li::before{content:"–";position:absolute;left:0;color:var(--amber);}
  label{display:block;font-size:12.5px;color:var(--ink-dim);margin:12px 0 5px;}
  input[type=text], textarea{
    width:100%;padding:10px;background:var(--surface-2);border:1px solid var(--line);
    color:var(--ink);border-radius:3px;font-family:inherit;font-size:14px;
  }
  .voice-row{display:flex;gap:8px;}
  .voice-row input{flex:1;}
  .mic-btn{
    width:42px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;
    color:var(--ink);cursor:pointer;font-size:16px;
  }
  .mic-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);}
  .photo-drop{
    border:1px dashed var(--line);border-radius:3px;padding:18px;text-align:center;
    color:var(--ink-dim);font-size:13px;cursor:pointer;margin-top:6px;
  }
  .photo-drop img{max-width:100%;border-radius:3px;margin-top:8px;}
  .catch-result{margin-top:10px;padding:10px;background:var(--surface-2);border-radius:3px;font-size:13.5px;}
  .catch-result .sp{font-family:'Fraunces',serif;font-size:16px;color:var(--amber);}
  .entry{
    border-bottom:1px solid var(--line);padding:14px 0;
  }
  .entry:last-child{border-bottom:none;}
  .entry .when{font-size:11px;color:var(--ink-dim);}
  .entry .place{font-family:'Fraunces',serif;font-size:16px;margin:2px 0 6px;}
  .entry .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .tag{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--ink-dim);}
  .entry img{max-width:100%;border-radius:3px;margin-top:8px;display:block;}
  .del{background:none;border:none;color:var(--danger);font-size:11.5px;cursor:pointer;padding:0;margin-top:8px;}
  .empty{color:var(--ink-dim);font-size:13.5px;text-align:center;padding:30px 10px;}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--ink-dim);border-top-color:var(--amber);border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="hero-mark" width="72" height="52" viewBox="0 0 72 52" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="36" cy="40" rx="30" ry="4" fill="none" stroke="#6FA8B8" stroke-opacity="0.35" stroke-width="1.4"/>
      <ellipse cx="36" cy="40" rx="19" ry="2.6" fill="none" stroke="#6FA8B8" stroke-opacity="0.5" stroke-width="1.4"/>
      <line x1="36" y1="6" x2="36" y2="35" stroke="#A9BDB4" stroke-width="1.2"/>
      <circle cx="36" cy="35" r="6.5" fill="#E0A458"/>
      <circle cx="36" cy="35" r="6.5" fill="none" stroke="#1B120A" stroke-opacity="0.15" stroke-width="1"/>
    </svg>
    <div>
      <h1>Indicator</h1>
      <div class="sub">CONDITIONS · CATCHES · WHAT THE BUGS ARE DOING</div>
    </div>
    <div class="hero-rule"></div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="checkin">Check in</button>
    <button data-tab="log">Log</button>
  </nav>

  <section id="checkin" class="active">
    <div class="card">
      <h2>Where are you fishing?</h2>
      <button class="primary" id="btnCheckin">Check in at this spot</button>
      <div class="notice" id="checkinStatus"></div>
      <div id="manualLocationRow" style="display:none;margin-top:12px;">
        <label>Location didn't come through — enter a place instead</label>
        <div class="voice-row">
          <input type="text" id="manualLocationInput" placeholder="e.g. Missoula, MT or a lake name">
          <button class="secondary" id="btnManualLocation" style="width:auto;padding:0 14px;margin-top:0;">Go</button>
        </div>
      </div>
    </div>

    <div class="card" id="conditionsCard" style="display:none;">
      <h2 id="placeName">Conditions</h2>
      <div class="grid2" id="statGrid"></div>
      <ul class="insight-list" id="insightList"></ul>
    </div>

    <div class="card" id="entryCard" style="display:none;">
      <h2>What are you throwing?</h2>
      <div class="voice-row">
        <input type="text" id="lureInput" placeholder="Lure or bait, e.g. olive woolly bugger">
        <button class="mic-btn" id="micBtn" title="Speak instead">🎙</button>
      </div>
      <div class="notice" id="voiceStatus"></div>

      <label>Catch photo (optional — we'll estimate species, length, and weight)</label>
      <div class="photo-drop" id="photoDrop">Tap to add a photo of your catch</div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;">
      <div id="photoPreview"></div>
      <div id="catchResult"></div>

      <button class="primary" id="btnSave" style="margin-top:14px;">Save entry</button>
    </div>
  </section>

  <section id="log">
    <div class="card" id="logCard">
      <h2>Your trips</h2>
      <div id="entries"><div class="empty">No entries yet — check in to log your first trip.</div></div>
    </div>
  </section>
</div>

<script>
const SHARED = false;
let current = null; // holds in-progress check-in data
let usingMemory = false;
let memoryStore = {};

// ---------- storage shim ----------
async function storeSet(key, value){
  try{
    if(typeof window.storage === 'undefined') throw new Error('no storage');
    return await window.storage.set(key, value, SHARED);
  }catch(e){
    usingMemory = true;
    memoryStore[key] = value;
    return {key, value};
  }
}
async function storeGet(key){
  try{
    if(typeof window.storage === 'undefined') throw new Error('no storage');
    return await window.storage.get(key, SHARED);
  }catch(e){
    if(key in memoryStore) return {key, value: memoryStore[key]};
    return null;
  }
}
async function storeList(prefix){
  try{
    if(typeof window.storage === 'undefined') throw new Error('no storage');
    return await window.storage.list(prefix, SHARED);
  }catch(e){
    return {keys: Object.keys(memoryStore).filter(k=>k.startsWith(prefix))};
  }
}
async function storeDelete(key){
  try{
    if(typeof window.storage === 'undefined') throw new Error('no storage');
    return await window.storage.delete(key, SHARED);
  }catch(e){
    delete memoryStore[key];
    return {key, deleted:true};
  }
}

// ---------- tabs ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'log') renderEntries();
  });
});

// ---------- geolocation ----------
function getLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation not supported')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}),
      err => reject(err),
      {enableHighAccuracy:true, timeout:10000}
    );
  });
}

async function fetchPlaceName(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const d = await r.json();
    return d.locality || d.city || d.principalSubdivision || 'Your spot';
  }catch(e){
    return 'Your spot';
  }
}

async function fetchWeather(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,pressure_msl,relative_humidity_2m,wind_speed_10m,cloud_cover,precipitation,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&pressure_unit=hPa`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('weather fetch failed');
  const d = await r.json();
  return d.current;
}

async function fetchWater(lat, lon){
  // USGS NWIS instantaneous values, US only. Small bounding box around the point.
  const d = 0.35;
  const bbox = `${(lon-d).toFixed(2)},${(lat-d).toFixed(2)},${(lon+d).toFixed(2)},${(lat+d).toFixed(2)}`;
  try{
    const r = await fetch(`https://waterservices.usgs.gov/nwis/iv/?format=json&bBox=${bbox}&parameterCd=00010,00300&siteStatus=active`);
    if(!r.ok) throw new Error('no data');
    const d2 = await r.json();
    const series = d2?.value?.timeSeries || [];
    if(series.length === 0) return null;
    let waterTempC = null, doMgL = null, siteName = null;
    series.forEach(s=>{
      const code = s.variable?.variableCode?.[0]?.value;
      const val = parseFloat(s.values?.[0]?.value?.[0]?.value);
      if(isNaN(val)) return;
      if(code === '00010') waterTempC = val;
      if(code === '00300') doMgL = val;
      siteName = s.sourceInfo?.siteName || siteName;
    });
    if(waterTempC === null && doMgL === null) return null;
    return {
      waterTempF: waterTempC !== null ? (waterTempC * 9/5 + 32) : null,
      doMgL,
      siteName
    };
  }catch(e){
    return null;
  }
}

// ---------- insect / bite heuristics ----------
function pressureTrendNote(trend){
  if(trend === null) return null;
  if(trend > 1) return "Pressure's climbing — bite often slows until it steadies.";
  if(trend < -1) return "Pressure's dropping — fish often feed hard ahead of a front.";
  return "Pressure's holding steady — generally a reliable bite window.";
}

function insectForecast(weatherF, cloudPct, month, hour, windMph, waterTempF){
  const notes = [];
  const t = waterTempF ?? weatherF; // fall back to air temp if no water data
  if(t < 45){
    notes.push("Cold water — expect midges only, little surface action.");
  } else if(t >= 45 && t < 58){
    notes.push("Prime range for early mayflies (Blue-winged Olives) and midges, especially on overcast afternoons.");
  } else if(t >= 58 && t < 68){
    notes.push("Caddis and mayfly activity likely, particularly in low light around dawn and dusk.");
  } else if(t >= 68 && t < 78){
    notes.push("Terrestrials — ants, beetles, hoppers — become a strong bet, plus evening caddis.");
  } else {
    notes.push("Warm water can push insect activity to the coolest parts of the day; fish deeper structure midday.");
  }

  if(cloudPct !== undefined && cloudPct > 60 && t < 68){
    notes.push("Heavy cloud cover often triggers stronger mayfly hatches than sun.");
  }
  if(windMph !== undefined && windMph > 12){
    notes.push("Steady wind is knocking terrestrials onto the water — edges and grassy banks worth a look.");
  }
  if(hour !== undefined && (hour <= 8 || hour >= 19) && t >= 60){
    notes.push("Low light and warm water — good window for caddis and emerger activity.");
  }
  return notes.slice(0,3);
}

// ---------- check-in flow ----------
document.getElementById('btnCheckin').addEventListener('click', runCheckin);
document.getElementById('btnManualLocation').addEventListener('click', runManualLocation);
document.getElementById('manualLocationInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') runManualLocation();
});

async function runCheckin(){
  const statusEl = document.getElementById('checkinStatus');
  const btn = document.getElementById('btnCheckin');
  document.getElementById('manualLocationRow').style.display = 'none';
  btn.disabled = true;
  statusEl.innerHTML = '<span class="spin"></span>Finding your location…';
  try{
    const {lat, lon} = await getLocation();
    await processCheckin(lat, lon, null);
  }catch(err){
    statusEl.textContent = "Couldn't access your location from here — enter a place below instead.";
    document.getElementById('manualLocationRow').style.display = '';
  }
  btn.disabled = false;
}

async function runManualLocation(){
  const input = document.getElementById('manualLocationInput');
  const query = input.value.trim();
  if(!query) return;
  const statusEl = document.getElementById('checkinStatus');
  statusEl.innerHTML = '<span class="spin"></span>Looking up that place…';
  try{
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1`);
    const d = await r.json();
    const hit = d?.results?.[0];
    if(!hit){
      statusEl.textContent = "Couldn't find that place — try a nearby town or a more specific name.";
      return;
    }
    await processCheckin(hit.latitude, hit.longitude, [hit.name, hit.admin1].filter(Boolean).join(', '));
  }catch(e){
    console.error('manual location lookup failed:', e);
    statusEl.textContent = 'Lookup failed: ' + (e.message || 'network request was blocked') + '. This screen may restrict outside network calls — try opening the saved file directly in your phone or desktop browser instead of this preview.';
  }
}

async function processCheckin(lat, lon, placeOverride){
  const statusEl = document.getElementById('checkinStatus');
  const btn = document.getElementById('btnCheckin');
  btn.disabled = true;
  try{
    statusEl.innerHTML = '<span class="spin"></span>Pulling conditions…';

    let weather, water, place, prevTrip;
    try{
      [place, weather, water, prevTrip] = await Promise.all([
        placeOverride ? Promise.resolve(placeOverride) : fetchPlaceName(lat, lon),
        fetchWeather(lat, lon),
        fetchWater(lat, lon).catch(()=>null),
        getMostRecentTrip()
      ]);
    }catch(fetchErr){
      console.error('conditions fetch failed:', fetchErr);
      statusEl.textContent = 'Could not reach conditions data: ' + (fetchErr.message || 'request blocked') + '. This preview screen may block outside network calls — try opening the saved file directly in your browser instead.';
      btn.disabled = false;
      return;
    }

    if(!weather){
      statusEl.textContent = "Couldn't reach weather data — check your connection and try again.";
      btn.disabled = false;
      return;
    }

    const now = new Date();
    const trend = prevTrip && prevTrip.pressure ? Math.round((weather.pressure_msl - prevTrip.pressure)*10)/10 : null;

    current = {
      lat, lon, place,
      time: now.toISOString(),
      tempF: Math.round(weather.temperature_2m),
      pressure: Math.round(weather.pressure_msl*10)/10,
      humidity: weather.relative_humidity_2m,
      windMph: Math.round(weather.wind_speed_10m),
      cloudPct: weather.cloud_cover,
      precip: weather.precipitation,
      waterTempF: water?.waterTempF ? Math.round(water.waterTempF) : null,
      doMgL: water?.doMgL ?? null,
      lure: '', catchPhotoDataUrl: null, catchEstimate: null
    };

    document.getElementById('placeName').textContent = place;
    const grid = document.getElementById('statGrid');
    grid.innerHTML = `
      <div class="stat"><div class="label">Air temp</div><div class="val">${current.tempF}°F</div></div>
      <div class="stat"><div class="label">Pressure</div><div class="val">${current.pressure} hPa</div>${trend!==null?`<div class="trend">${trend>0?'+':''}${trend} since last trip</div>`:''}</div>
      <div class="stat"><div class="label">Wind</div><div class="val">${current.windMph} mph</div></div>
      <div class="stat"><div class="label">Cloud cover</div><div class="val">${current.cloudPct}%</div></div>
      <div class="stat"><div class="label">Water temp</div><div class="val">${current.waterTempF ? current.waterTempF+'°F' : '—'}</div></div>
      <div class="stat"><div class="label">Dissolved O₂</div><div class="val">${current.doMgL ? current.doMgL+' mg/L' : '—'}</div></div>
    `;

    const insights = insectForecast(current.tempF, current.cloudPct, now.getMonth(), now.getHours(), current.windMph, current.waterTempF);
    const trendNote = pressureTrendNote(trend);
    const list = document.getElementById('insightList');
    list.innerHTML = '';
    if(trendNote){ const li=document.createElement('li'); li.textContent = trendNote; list.appendChild(li); }
    insights.forEach(n=>{ const li=document.createElement('li'); li.textContent=n; list.appendChild(li); });
    if(!current.waterTempF && !current.doMgL){
      const li=document.createElement('li'); li.textContent='No water-quality gauge nearby — insect forecast is based on air temperature instead.'; list.appendChild(li);
    }

    document.getElementById('conditionsCard').style.display = '';
    document.getElementById('entryCard').style.display = '';
    document.getElementById('manualLocationRow').style.display = 'none';
    statusEl.textContent = '';
  }catch(err){
    statusEl.textContent = "Couldn't pull conditions for that spot. Try again.";
  }
  btn.disabled = false;
}

async function getMostRecentTrip(){
  const list = await storeList('trip:');
  if(!list || !list.keys || list.keys.length === 0) return null;
  const keys = list.keys.sort().reverse();
  const res = await storeGet(keys[0]);
  return res ? JSON.parse(res.value) : null;
}

// ---------- voice input for lure ----------
const lureInput = document.getElementById('lureInput');
lureInput.addEventListener('input', ()=>{ if(current) current.lure = lureInput.value; });

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
const voiceStatus = document.getElementById('voiceStatus');
if(!SpeechRec){
  micBtn.disabled = true;
  voiceStatus.textContent = 'Voice input not supported in this browser — type it instead.';
}else{
  const rec = new SpeechRec();
  rec.continuous = false;
  rec.interimResults = false;
  rec.lang = 'en-US';
  let listening = false;
  micBtn.addEventListener('click', ()=>{
    if(listening) return;
    listening = true;
    micBtn.classList.add('listening');
    voiceStatus.textContent = 'Listening…';
    rec.start();
  });
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    lureInput.value = text;
    if(current) current.lure = text;
    voiceStatus.textContent = '';
  };
  rec.onerror = ()=>{ voiceStatus.textContent = "Didn't catch that — try again or type it."; };
  rec.onend = ()=>{ listening = false; micBtn.classList.remove('listening'); };
}

// ---------- photo + catch estimate ----------
const photoDrop = document.getElementById('photoDrop');
const photoInput = document.getElementById('photoInput');
photoDrop.addEventListener('click', ()=>photoInput.click());
photoInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const dataUrl = await fileToDataUrl(file);
  document.getElementById('photoPreview').innerHTML = `<img src="${dataUrl}">`;
  if(current) current.catchPhotoDataUrl = dataUrl;
  await estimateCatch(dataUrl);
});

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function estimateCatch(dataUrl){
  const resultEl = document.getElementById('catchResult');
  resultEl.innerHTML = '<div class="notice"><span class="spin"></span>Looking at your catch…</div>';
  try{
    const base64Data = dataUrl.split(',')[1];
    const mediaType = dataUrl.split(';')[0].split(':')[1];
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 500,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
            { type: "text", text: "Identify the fish species in this photo and give a rough length and weight estimate based on visual proportions (use a hand, rod, or other object in frame as scale if visible; otherwise give your best rough guess and lower your confidence). Respond ONLY with JSON, no other text, in this exact shape: {\"species\":\"\",\"estimated_length_in\":0,\"estimated_weight_lb\":0,\"confidence\":\"low|medium|high\",\"notes\":\"\"}" }
          ]
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b=>b.type==='text');
    if(!textBlock) throw new Error('no response');
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(current) current.catchEstimate = parsed;
    resultEl.innerHTML = `
      <div class="catch-result">
        <div class="sp">${parsed.species || 'Unknown species'}</div>
        <div>~${parsed.estimated_length_in ?? '—'} in · ~${parsed.estimated_weight_lb ?? '—'} lb</div>
        <div class="notice">Confidence: ${parsed.confidence || 'unknown'}. ${parsed.notes || ''} Estimate only — for accuracy, include something of known size in the shot next time.</div>
      </div>`;
  }catch(e){
    resultEl.innerHTML = '<div class="notice">Could not estimate the catch from this photo. You can still save the entry.</div>';
  }
}

// ---------- save entry ----------
document.getElementById('btnSave').addEventListener('click', saveEntry);

async function saveEntry(){
  if(!current){ return; }
  current.lure = lureInput.value;
  const key = `trip:${current.time}`;
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try{
    await storeSet(key, JSON.stringify(current));
    resetCheckin();
    document.querySelector('nav.tabs button[data-tab="log"]').click();
  }catch(e){
    btn.textContent = 'Save entry';
    btn.disabled = false;
    alert('Could not save this entry. Try again.');
    return;
  }
  btn.textContent = 'Save entry';
  btn.disabled = false;
}

function resetCheckin(){
  current = null;
  document.getElementById('conditionsCard').style.display = 'none';
  document.getElementById('entryCard').style.display = 'none';
  lureInput.value = '';
  document.getElementById('photoPreview').innerHTML = '';
  document.getElementById('catchResult').innerHTML = '';
  document.getElementById('checkinStatus').textContent = '';
}

// ---------- log / history ----------
async function renderEntries(){
  const container = document.getElementById('entries');
  const list = await storeList('trip:');
  if(!list || !list.keys || list.keys.length === 0){
    container.innerHTML = '<div class="empty">No entries yet — check in to log your first trip.</div>';
    return;
  }
  const keys = list.keys.sort().reverse();
  const trips = [];
  for(const k of keys){
    const res = await storeGet(k);
    if(res) trips.push({key:k, data: JSON.parse(res.value)});
  }
  container.innerHTML = '';
  trips.forEach(({key, data})=>{
    const d = new Date(data.time);
    const div = document.createElement('div');
    div.className = 'entry';
    const tags = [];
    tags.push(`${data.tempF}°F air`);
    if(data.waterTempF) tags.push(`${data.waterTempF}°F water`);
    tags.push(`${data.pressure} hPa`);
    if(data.doMgL) tags.push(`${data.doMgL} mg/L O₂`);
    if(data.lure) tags.push(data.lure);
    div.innerHTML = `
      <div class="when">${d.toLocaleDateString()} · ${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div>
      <div class="place">${data.place}</div>
      <div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      ${data.catchEstimate ? `<div class="catch-result"><span class="sp">${data.catchEstimate.species}</span><div>~${data.catchEstimate.estimated_length_in} in · ~${data.catchEstimate.estimated_weight_lb} lb</div></div>` : ''}
      ${data.catchPhotoDataUrl ? `<img src="${data.catchPhotoDataUrl}">` : ''}
      <button class="del" data-key="${key}">Delete entry</button>
    `;
    container.appendChild(div);
  });
  container.querySelectorAll('.del').forEach(b=>{
    b.addEventListener('click', async ()=>{
      await storeDelete(b.dataset.key);
      renderEntries();
    });
  });
}
</script>
